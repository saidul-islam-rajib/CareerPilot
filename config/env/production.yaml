http:
  cors_origins: []
  trusted_proxy_hops: 1
api:
  allow_server_change: false
persistence:
  mode: database
observability:
  enabled: true
  trace_sample_ratio: 0.2
coordination:
  mode: redis
  environment: production
matching:
  mode: claude
profile:
  storage:
    backend: s3
    local_root: /data/files
    s3:
      endpoint: http://minio:9000
bff:
  secure_cookies: true
  web:
    allowed_origins: []
  admin:
    allowed_origins: []

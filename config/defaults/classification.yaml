# How CareerPilot sorts jobs into on-site, remote, and hybrid, and which country a job is in,
# when the job board does not say. A job in a known place with no remote or hybrid wording counts as on-site.
discovery:
  classification:
    # Only this much of a job description is read.
    scan_chars: 6000
    arrangements:
      remote: [remote, fully remote, remote first, remote friendly, work from home, wfh, work from anywhere, anywhere in the world, telecommute, distributed team]
      hybrid: [hybrid, partly remote, partially remote, flexible working, flexible location]
      onsite: [on site, onsite, in office, office based, work from office, wfo, in person]
    # ISO country code, then place names that point to it. Leave out names that are also everyday words.
    places:
      BD: [bangladesh, dhaka, chattogram, chittagong, sylhet, khulna, rajshahi, gazipur, narayanganj, barishal, barisal, rangpur, mymensingh, cumilla, comilla, bogura, savar, uttara, gulshan, banani, mirpur, mohakhali, dhanmondi, motijheel, tejgaon, bashundhara, badda, baridhara]

# Skills the app recognises in job circulars, to show which ones a profile does not list yet.
# Each key is the name shown to people; the list holds other spellings that mean the same skill.
# Leave out everyday words that are also skill names (go, r, c, rest, express, excel, unity) unless spelled out.
matching:
  skill_gap:
    limit: 3
    title_weight: 3

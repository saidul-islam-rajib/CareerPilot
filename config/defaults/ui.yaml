# User interface defaults (Planning/16-UX-Design.md §7)
ui:
  # Active theme for the user web and mobile apps; one of ThemeKey: sober, horizon, orchid.
  # Super Admins override it at runtime in platform_settings.
  active_theme: sober
  admin_theme: sober
  # Wait this long after the last change before saving a setting the user is adjusting (+/−, typing).
  save_delay_ms: 700
  # Phone forms show up to this many choices side by side; longer lists open a searchable list.
  segmented_max_options: 4
  # How many company and role suggestions the Today search shows.
  search_suggestion_limit: 8
  # Where "Learn" sends people for a skill a job asks for; {skill} is replaced with the skill name.
  learn_skill_url: https://www.google.com/search?q=learn+{skill}
  # Quick choices on the Submission time page (24-hour HH:MM, user's time zone).
  submission_window_presets:
    - { key: working_hours, start: "09:00", end: "17:00" }
    - { key: morning, start: "08:00", end: "12:00" }
    - { key: evening, start: "18:00", end: "22:00" }

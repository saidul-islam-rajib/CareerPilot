matching:
  mode: rules
  model: claude-opus-5-5
  effort: low
  max_tokens: 4000
  api_key_env: ANTHROPIC_API_KEY
  prompt_file: config/prompts/match-v1.md
  rules_version: rules-1
  min_score: 50
  include_flagged: false
  default_route: ats_portal
  application_email:
    window_chars: 160
    phrases:
      - send your cv
      - send your resume
      - send cv
      - send resume
      - send your application
      - send applications
      - applications should be sent
      - email your cv
      - email your resume
      - email your application
      - mail your cv
      - mail your resume
      - forward your cv
      - forward your resume
      - drop your cv
      - submit your cv
      - submit your resume
      - apply by email
      - apply via email
      - apply through email
      - apply with your cv
      - interested candidates
      - candidates may send
      - cv to
      - resume to
    excluded_words: [accommodation, accessibility, privacy, noreply, no-reply, donotreply, legal, dpo, gdpr, security, press, media, abuse, unsubscribe, compliance, ethics, eeo]
  weights:
    base: 30
    title: 30
    skill: 8
    max_skills: 4
    arrangement: 10
  # Do not suggest the same company and role again within this many days of applying.
  reapply_cooldown_days: 15
  # Show at most this many jobs from one company, keeping the best matches.
  max_jobs_per_company: 3
  track_rules:
    remote:
      work_arrangements: [remote]
    international_sponsored:
      exclude_home_country: true
      require_sponsorship: true
    bangladesh_onsite:
      home_country: true
      work_arrangements: [onsite, hybrid]
    bangladesh_government:
      home_country: true
      types: [government_job]
    custom:
      types: [masters, phd, scholarship]
  sponsorship:
    negative:
      - sponsorship is not available
      - no visa sponsorship
      - unable to sponsor
      - cannot sponsor
    positive:
      - visa sponsorship
      - sponsorship available
      - will sponsor
  compensation:
    currencies: [BDT, USD, EUR, GBP, CAD, AUD, AED, SAR, MYR, SGD]
    max_amount_minor: 100000000000
    hours_per_month: 160
    months_per_year: 12
    period_window_chars: 40
    minor_units: 100
    preference_bonus: 10
    preference_penalty: 10
    currency_phrases:
      BDT: [bdt, tk, taka, "৳"]
      USD: [usd, "$"]
      EUR: [eur, "€"]
      GBP: [gbp, "£"]
      CAD: [cad]
      AUD: [aud]
      AED: [aed]
      SAR: [sar]
      MYR: [myr]
      SGD: [sgd]
    period_phrases:
      hourly: [per hour, an hour, hourly, /hour, /hr, per hr]
      monthly: [per month, a month, monthly, /month, /mo, per mo]
      yearly: [per year, a year, annual, annually, per annum, yearly, /year, /yr, p.a.]
  feedback:
    weight: 15
    max_shift: 25
    min_similarity: 0.34
    same_organization_similarity: 0.5
    max_entries: 500

[project]
name = "careerpilot-workers"
version = "1.0.0"
description = "CareerPilot Temporal workers. Developed by Team Sober."
requires-python = ">=3.11"
dependencies = ["careerpilot-core", "temporalio>=1.9"]

[project.scripts]
careerpilot-workers = "careerpilot_workers.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "../core"]

[tool.ruff]
extend = "../core/pyproject.toml"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"
extraPaths = ["../core/src", "src"]
pythonVersion = "3.11"

[tool.ruff.lint.isort]
known-first-party = ["careerpilot", "careerpilot_workers"]

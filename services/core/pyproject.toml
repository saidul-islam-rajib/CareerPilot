[project]
name = "careerpilot-core"
version = "1.0.0"
description = "CareerPilot backend: bounded contexts, platform, and API. Developed by Team Sober."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
  "redis>=5.2",
  "httpx>=0.27",
  "defusedxml>=0.7.1",
  "anthropic>=2.3",
  "python-multipart>=0.0.20",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.26", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "C90", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "RUF001", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.11"

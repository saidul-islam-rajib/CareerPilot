name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv services/.venv
      - run: services/.venv/bin/pip install -e "services/core[dev]" -e services/api -e services/workers
      - name: Lint and format
        working-directory: services/core
        run: |
          ../.venv/bin/ruff check .
          ../.venv/bin/ruff format --check .
          ../.venv/bin/ruff check ../workers
          ../.venv/bin/ruff format --check ../workers
      - name: Types
        run: |
          (cd services/core && ../.venv/bin/pyright)
          (cd services/workers && ../.venv/bin/pyright)
      - name: Unit tests
        run: |
          (cd services/core && ../.venv/bin/pytest -q)
          (cd services/workers && ../.venv/bin/pytest -q)

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: careerpilot

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CAREERPILOT_APP_DB_USER: ${CAREERPILOT_APP_DB_USER}
      CAREERPILOT_APP_DB_PASSWORD: ${CAREERPILOT_APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"

  redis-coord:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-coord-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      CAREERPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CAREERPILOT_DATABASE_URL: postgresql+psycopg://${CAREERPILOT_APP_DB_USER}:${CAREERPILOT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CAREERPILOT_TOKEN_SECRET: ${CAREERPILOT_TOKEN_SECRET}
      CAREERPILOT_REDIS_CACHE_URL: redis://redis-cache:6379/0
      CAREERPILOT_REDIS_COORD_URL: redis://redis-coord:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  user-api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: &api-env
      CAREERPILOT_DATABASE_URL: postgresql+psycopg://${CAREERPILOT_APP_DB_USER}:${CAREERPILOT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CAREERPILOT_TOKEN_SECRET: ${CAREERPILOT_TOKEN_SECRET}
      CAREERPILOT_REDIS_CACHE_URL: redis://redis-cache:6379/0
      CAREERPILOT_REDIS_COORD_URL: redis://redis-coord:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CAREERPILOT_SMTP_HOST: mailpit
      CAREERPILOT_MAIL_USER: ${CAREERPILOT_MAIL_USER:-}
      CAREERPILOT_MAIL_PASSWORD: ${CAREERPILOT_MAIL_PASSWORD:-}
      CAREERPILOT_WEB_BASE_URL: ${CAREERPILOT_WEB_BASE_URL:-}
      CAREERPILOT_OWNER_EMAIL: ${CAREERPILOT_OWNER_EMAIL:-}
      CAREERPILOT_GOOGLE_CLIENT_ID: ${CAREERPILOT_GOOGLE_CLIENT_ID:-}
      CAREERPILOT_GOOGLE_CLIENT_SECRET: ${CAREERPILOT_GOOGLE_CLIENT_SECRET:-}
      CAREERPILOT_VAULT_KEY: ${CAREERPILOT_VAULT_KEY:-}
    volumes:
      - profile-files:/data/files
    ports:
      - "${CAREERPILOT_USER_API_BIND:-127.0.0.1}:8000:8000"
    depends_on: &api-deps
      migrate:
        condition: service_completed_successfully
      redis-cache:
        condition: service_started
      redis-coord:
        condition: service_started

  admin-api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["uvicorn", "careerpilot_api.apps:admin_api", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment: *api-env
    volumes:
      - profile-files:/data/files
    ports:
      - "127.0.0.1:8001:8001"
    depends_on: *api-deps

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.36.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      - temporal

  workers:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["careerpilot-workers"]
    restart: on-failure
    environment:
      <<: *api-env
      CAREERPILOT_TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - profile-files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cache:
        condition: service_started
      redis-coord:
        condition: service_started
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: web
        PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - user-api

  admin:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: admin
        PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - admin-api

volumes:
  postgres-data:
  redis-coord-data:
  profile-files:
